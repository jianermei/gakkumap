<script>

var map;

$(document).ready(function(){
	if (window.location.protocol === 'file:') {
		$('#output').text('ローカルサーバーを起動し、http://localhost:8000/selectTest.html を開いてください（README.md 参照）。');
		$('form :input').prop('disabled', true);
		return;
	}
	var config = window.GAKKUMAP_CONFIG || {};
	if (!config.apiKey || config.apiKey === 'YOUR_GOOGLE_MAPS_API_KEY') {
		$('#output').text('config.example.js を config.local.js にコピーし、Google Maps API キーを設定してください。');
		return;
	}
	setPref();
	var mapsScript = document.createElement('script');
	mapsScript.async = true;
	mapsScript.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(config.apiKey) + '&loading=async&libraries=marker&callback=initMap';
	mapsScript.onerror = function () {
		$('#output').text('Google Maps を読み込めませんでした。ネットワーク接続を確認してください。');
	};
	document.head.appendChild(mapsScript);
});
function gm_authFailure() {
  map = null;
  $('#output').text('Google Maps の認証に失敗しました。API キーの許可リファラーを確認してください（README.md 参照）。');
}
function initMap() {
  //var myLatLng = new google.maps.LatLng(35.7873194, 140.029875);	//白井市
  //var myLatLng = new google.maps.LatLng(38.38095993790538,140.27592658996582);	//寒河江市

  var mapOptions = {
    zoom: 10,
    // Google-provided map ID for local testing; use your own ID in production.
    mapId: (window.GAKKUMAP_CONFIG || {}).mapId || 'DEMO_MAP_ID',
    center: {lat: 38.38095993790538, lng: 140.27592658996582},
    draggableCursor : 'default',
    mapTypeId: 'roadmap',
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false,
    isFractionalZoomEnabled: window.matchMedia('(max-width: 799px)').matches ? true : undefined
  };

  map = new google.maps.Map(document.getElementById('map_canvas'),
      mapOptions);
}
// Fit results in the visible map below the floating search controls.
var lastMapResult = null;
function mapResultPadding() {
  var canvas = document.getElementById('map_canvas').getBoundingClientRect();
  var search = document.getElementById('place-search').getBoundingClientRect();
  var isMobile = window.matchMedia('(max-width: 799px)').matches;
  var side = Math.min(isMobile ? 16 : 40, canvas.width / 8, canvas.height / 8);
  var top = side;
  if (search.right > canvas.left && search.left < canvas.right &&
      search.bottom > canvas.top && search.top < canvas.bottom) {
    // Extra room accommodates the pin above its geographic anchor.
    top = Math.max(top, search.bottom - canvas.top + 48);
  }
  // Keep a usable viewport even with an expanded list on a small screen.
  top = Math.min(top, Math.max(side, canvas.height - side - 80));
  return {top: top, right: side, bottom: isMobile ? Math.max(side, 30) : side, left: side};
}
function fitMapResults(resultBounds) {
  lastMapResult = {bounds: resultBounds.toJSON()};
  map.fitBounds(resultBounds, mapResultPadding());
}
function centerMapResult(position) {
  lastMapResult = {position: position};
  var padding = mapResultPadding();
  map.setZoom(16);
  map.setCenter(position);
  map.panBy(0, -(padding.top - padding.bottom) / 2);
}

function selectProc(){
	if (!map || !A27Xml || $('#gaiku').val() === '00') {
		$('#output').text('地図と学校データの読み込み後、学校を選択してください。');
		return;
	}
	$('#output').text('');
	// if($('#city option:selected').val() == "00"){
	//	//都道府県界の描画処理
	//	getPrefCoords();
	// }else if($('#gaiku option:selected').val() == "00"){
	//	//市区町村界の描画処理
	//	getCityCoords();
	// }else{
	if($('#city option:selected').val() != "00"){
		//"字・町丁界の描画処理
		getSchoolCoords();
		//renderGaiku();
	}
}

// リセット処理
function deletePoly() {
	clearSchoolMarker();
	clearSchoolBoundary();
}

// Redrawing a boundary does not change the route endpoints.
function clearSchoolBoundary() {
	boundaryLoadVersion++;
	// ポリゴンの削除
	if (sArea) {
		var area
		while (area = sArea.pop()) {
			area.setMap(null);
		}
	}
	// ポリラインの削除
	if (sLine) {
		for(var i = 0; i < sLine.length; i++){
			sLine[i].setMap(null);
		}
	}
}

</script>

<body>
<main id="container" class="map-app">
  <header class="app-header"><h1>学区マップ <span class="beta">BETA</span></h1><span class="header-note">学校と暮らしの距離を知る</span></header>
  <section class="map-stage" aria-label="学校と検索地点の地図">
    <div id="map_canvas"></div>
    <form id="place-search" class="place-search" role="search">
      <label class="sr-only" for="place-query">場所・住所を検索</label>
      <div class="search-controls">

      <div id="place-results" hidden><p id="place-results-label" class="sr-only">検索候補から場所を選択してください</p><ul id="place-result" aria-labelledby="place-results-label"></ul></div>
      <p id="search-status" role="status" aria-live="polite"></p>
    </form>
  </section>
  <section class="school-panel" aria-label="学校とルート">
    <button id="sheet-handle" class="sheet-handle" type="button" aria-label="学校・ルート情報を隠す" aria-expanded="true" aria-controls="sheet-content"><span aria-hidden="true"></span></button>
    <div id="sheet-content">
    <div class="school-summary">
      <div class="school-heading"><span class="eyebrow">調べたい学校</span><h2 id="school-title">学校を選択</h2><p id="school-location">都道府県・市区町村から探す</p></div>
      <button id="panel-toggle" type="button" aria-expanded="true" aria-controls="school-options">閉じる</button>
    </div>
    <div id="school-options">
      <form name="form1" id="school-form">
        <div class="school-fields">
          <label for="pref">都道府県<select id="pref"><option value="00">--選択--</option></select></label>
          <label for="city">市区町村<select id="city"><option value="00">--選択--</option></select></label>
          <label for="gaiku">学校<select id="gaiku"><option value="00">--選択--</option></select></label>
        </div>
        <fieldset class="display-options"><legend>学区の表示</legend><label><input type="radio" name="ptype" value="1" checked />塗りつぶし</label><label><input type="radio" name="ptype" value="2" />境界線</label></fieldset>
      </form>
    </div>
    <div class="primary-actions"><button id="draw-school" type="button">学区を表示</button><button id="walking-button" type="button">徒歩ルート</button></div>
    <div id="walking-status" role="status" aria-live="polite"></div>
    <p id="walking-notices"></p>
    <div id="output" role="status" aria-live="polite"></div>
    <p id="school-location-note"></p>
    <div class="panel-footer"><p class="pin-legend"><span class="school-dot"></span>学校 <span class="search-dot"></span>検索地点</p><details class="clear-menu"><summary>クリア</summary><div class="clear-actions"><button id="place-clear" type="button">検索地点を削除</button><button id="walking-clear" type="button">ルートを削除</button><button type="button" onclick="deletePoly()">学区・学校を削除</button></div></details></div>
    </div>
  </section>
</main>
<span id="mode" hidden></span>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var panel = document.querySelector('.school-panel');
  var handle = document.getElementById('sheet-handle');
  var content = document.getElementById('sheet-content');
  var mobile = window.matchMedia('(max-width: 799px)');
  var collapsed = false;
  var gesture = null;
  var suppressClick = false;
  function setSheetCollapsed(value) {
    collapsed = mobile.matches && value;
    content.hidden = collapsed;
    panel.style.height = '';
    panel.classList.toggle('sheet-collapsed', collapsed);
    handle.setAttribute('aria-expanded', String(!collapsed));
    handle.setAttribute('aria-label', collapsed ? '学校・ルート情報を表示' : '学校・ルート情報を隠す');
  }
  handle.addEventListener('click', function () {
    if (suppressClick) { suppressClick = false; return; }
    setSheetCollapsed(!collapsed);
  });
  handle.addEventListener('pointerdown', function (event) {
    if (!mobile.matches || !event.isPrimary || event.button !== 0) return;
    suppressClick = false;
    gesture = {id: event.pointerId, y: event.clientY, height: panel.getBoundingClientRect().height, collapsed: collapsed};
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', function (event) {
    if (!gesture || gesture.id !== event.pointerId) return;
    var delta = event.clientY - gesture.y;
    if (Math.abs(delta) < 8) return;
    // Only the handle owns the drag; the panel body keeps normal scrolling.
    content.hidden = false;
    panel.style.height = Math.max(54, gesture.height - delta) + 'px';
  });
  handle.addEventListener('pointerup', function (event) {
    if (!gesture || gesture.id !== event.pointerId) return;
    var delta = event.clientY - gesture.y;
    var previous = gesture.collapsed;
    gesture = null;
    suppressClick = Math.abs(delta) >= 8;
    setSheetCollapsed(delta > 30 ? true : delta < -30 ? false : previous);
  });
  function cancelSheetDrag() {
    if (!gesture) return;
    var previous = gesture.collapsed;
    gesture = null;
    setSheetCollapsed(previous);
  }
  handle.addEventListener('pointercancel', cancelSheetDrag);
  handle.addEventListener('lostpointercapture', cancelSheetDrag);
  mobile.addEventListener('change', function () {
    cancelSheetDrag();
    setSheetCollapsed(false);
  });
  var options = document.getElementById('school-options');
  var toggle = document.getElementById('panel-toggle');
  function setExpanded(expanded) {
    options.hidden = !expanded;
    toggle.setAttribute('aria-expanded', String(expanded));
    toggle.textContent = expanded ? '閉じる' : '変更';
  }
  toggle.addEventListener('click', function () { setExpanded(options.hidden); });
  function updateSchoolSummary() {
    var school = document.getElementById('gaiku');
    var selected = school.value && school.value !== '00';
    document.getElementById('school-title').textContent = selected ? school.options[school.selectedIndex].text : '学校を選択';
    var location = ['pref', 'city'].map(function (id) {
      var select = document.getElementById(id);
      return select.value && select.value !== '00' && select.selectedIndex >= 0 ? select.options[select.selectedIndex].text : '';
    }).filter(Boolean).join('・');
    document.getElementById('school-location').textContent = location || '都道府県・市区町村から探す';
  }
  ['pref', 'city', 'gaiku'].forEach(function (id) {
    var select = document.getElementById(id);
    select.addEventListener('change', updateSchoolSummary);
    new MutationObserver(updateSchoolSummary).observe(select, {childList: true, subtree: true});
  });
  document.getElementById('school-form').addEventListener('submit', function (event) { event.preventDefault(); });
  document.getElementById('draw-school').addEventListener('click', function () {
    if (map && A27Xml && document.getElementById('gaiku').value !== '00') setExpanded(false);
    selectProc();
  });
  // Route text, notes and the draggable sheet change the actual map height.
  // Refit after layout settles rather than retaining a now-obscured center.
  var layoutTimer;
  if (window.ResizeObserver) {
    var observer = new ResizeObserver(function () {
      if (!map || !window.google) return;
      if (!mobile.matches) {
        var center = map.getCenter();
        google.maps.event.trigger(map, 'resize');
        if (center) map.setCenter(center);
        return;
      }
      clearTimeout(layoutTimer);
      layoutTimer = setTimeout(function () {
        if (!map || !mobile.matches || gesture) return;
        google.maps.event.trigger(map, 'resize');
        if (!lastMapResult) return;
        if (lastMapResult.bounds) map.fitBounds(lastMapResult.bounds, mapResultPadding());
        else centerMapResult(lastMapResult.position);
      }, 120);
    });
    observer.observe(document.getElementById('map_canvas'));
    observer.observe(document.getElementById('place-search'));
  }
});
</script>
