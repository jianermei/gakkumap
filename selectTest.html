<html>

<script>

var map;
var A27Xml;
var infoWindow;
var bounds;
var adminArea, adminLine;
var selp;
var sArea, sLine;

var prefCode, prefName;
var cityCode, cityCodeU, cityCodeL;
var cityName, cityNameU, cityNameL;
var gaikuCode, gaikuName;

var h22ka;			//町・字用xmlファイル名用
var h22kaXml;
var bdCoords = new Array();

$(document).ready(function(){
	if (window.location.protocol === 'file:') {
		$('#output').text('ローカルサーバーを起動し、http://localhost:8000/selectTest.html を開いてください（README.md 参照）。');
		$('form :input').prop('disabled', true);
		return;
	}
	var config = window.GAKKUMAP_CONFIG || {};
	if (!config.apiKey || config.apiKey === 'YOUR_GOOGLE_MAPS_API_KEY') {
		$('#output').text('config.example.js を config.local.js にコピーし、Google Maps API キーを設定してください。');
		return;
	}
	setPref();
	var mapsScript = document.createElement('script');
	mapsScript.async = true;
	mapsScript.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(config.apiKey) + '&loading=async&libraries=marker&callback=initMap';
	mapsScript.onerror = function () {
		$('#output').text('Google Maps を読み込めませんでした。ネットワーク接続を確認してください。');
	};
	document.head.appendChild(mapsScript);
});
function gm_authFailure() {
  map = null;
  $('#output').text('Google Maps の認証に失敗しました。API キーの許可リファラーを確認してください（README.md 参照）。');
}
function initMap() {
  //var myLatLng = new google.maps.LatLng(35.7873194, 140.029875);	//白井市
  //var myLatLng = new google.maps.LatLng(38.38095993790538,140.27592658996582);	//寒河江市

  var mapOptions = {
    zoom: 10,
    // Google-provided map ID for local testing; use your own ID in production.
    mapId: (window.GAKKUMAP_CONFIG || {}).mapId || 'DEMO_MAP_ID',
    center: {lat: 38.38095993790538, lng: 140.27592658996582},
    draggableCursor : 'default',
    mapTypeId: 'roadmap'
  };

  map = new google.maps.Map(document.getElementById('map_canvas'),
      mapOptions);
}
function selectProc(){
	if (!map || !A27Xml || $('#gaiku').val() === '00') {
		$('#output').text('地図と学校データの読み込み後、学校を選択してください。');
		return;
	}
	$('#output').text('');
	// if($('#city option:selected').val() == "00"){
	//	//都道府県界の描画処理
	//	getPrefCoords();
	// }else if($('#gaiku option:selected').val() == "00"){
	//	//市区町村界の描画処理
	//	getCityCoords();
	// }else{
	if($('#city option:selected').val() != "00"){
		//"字・町丁界の描画処理
		getSchoolCoords();
		//renderGaiku();
	}
}

// リセット処理
function deletePoly() {
	clearSchoolMarker();
	// ポリゴンの削除
	if (sArea) {
		var area
		while (area = sArea.pop()) {
			area.setMap(null);
		}
	}
	// ポリラインの削除
	if (sLine) {
		for(var i = 0; i < sLine.length; i++){
			sLine[i].setMap(null);
		}
	}
}

</script>
</head>
<!--<body onload="initialize()">-->
<body>

<h1>学区検索マップ（ALPHA）</h1>

<div id="container">

<form id="place-search" class="place-search">
<label for="place-query">場所・住所を検索</label>
<div class="search-controls">
<input id="place-query" type="search" placeholder="例：吉祥寺駅、武蔵野市吉祥寺南町2-35-9" />
<button id="place-search-button" type="submit">検索</button>
<button id="place-clear" type="button">検索ピンを削除</button>
</div>
<div id="place-results" hidden>
<label for="place-result">検索候補</label>
<select id="place-result"></select>
</div>
<p id="search-status" role="status" aria-live="polite"></p>
<p class="pin-legend">赤いピン：学校 ／ 青いピン：検索した場所</p>
</form>

<div class="place-search">
<button id="walking-button" type="button">徒歩ルートを表示（検索した場所 → 学校）</button>
<button id="walking-clear" type="button">ルートを削除</button>
<p id="walking-status" role="status" aria-live="polite"></p>
<p id="walking-notices" style="white-space:pre-line"></p>
</div>

<div style="width:260px;float:right;padding:0 0 0 10px;">
<form name="form1">
<p>
<input type="radio" name="ptype" value="1"/>ポリゴン
<input type="radio" name="ptype" value="2" checked />ポリライン
</p>
<table>
<tr>
<td>都道府県</td><td><select id="pref"><option value="00" selected>--選択--</option></select></td>
</tr>
<tr>
<td>市区町村</td><td><select id="city"><option value="00" selected>--選択--</option></select></td>
</tr>
<tr>
<td>学校</td><td><select id="gaiku"><option value="00" selected>--選択--</option></select></td>
</tr>
<tr>
<td><input type="button" value="描画" onclick="selectProc()" /></td>
<td><input type="button" value="描画削除" onclick="deletePoly()" /></td>
</tr>
</table>
</form>

</p>
</div><!-- //float right box -->

<div id="map_canvas" style="border: 1px solid black; height:530px"></div>
</div><!-- //container -->
<div id="output"></div>

<span id="mode"></span>
</body>
</html>
